{% extends "base.html" %}
{% block title %}修改密码 - 拾遗集{% endblock %}
{% block content %}
<div class="auth-box">
  <div class="auth-card">
    <h1 class="auth-title">修改密码</h1>
    <form method="post">
      <label class="form-label">原密码</label>
      <input type="password" name="old_password" required autofocus>
      <label class="form-label">新密码（至少 6 位）</label>
      <input type="password" name="new_password" required>
      <label class="form-label">确认新密码</label>
      <input type="password" name="new_password2" required>
      <button type="submit" class="btn-primary btn-block">保存</button>
    </form>
  </div>
</div>
{% endblock %}
