{% extends "base.html" %}
{% block title %}注册 - 拾遗集{% endblock %}
{% block content %}
<div class="auth-box">
  <div class="auth-card">
    <h1 class="auth-title">注册</h1>
    <form method="post">
      <label class="form-label">用户名（2-20 个字符）</label>
      <input type="text" name="username" required autofocus>
      <label class="form-label">密码（至少 6 位）</label>
      <input type="password" name="password" required>
      <label class="form-label">确认密码</label>
      <input type="password" name="password2" required>
      <button type="submit" class="btn-primary btn-block">注册</button>
    </form>
    <p class="auth-alt">已有账号？<a href="{{ url_for('login') }}">直接登录</a></p>
  </div>
</div>
{% endblock %}
